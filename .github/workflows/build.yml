name: Build images

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
  push:
    branches: main
    paths:
      - caddy-geoblock-crowdsec/Dockerfile
      - caddy-geoblock-ip-crowdsec/Dockerfile
      - .github/workflows/build.yml

permissions:
  contents: write

env:
  DOCKER_BUILDKIT: 1

jobs:
  version:
    name: Compute and tag next version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version and push tag
        id: version
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            version="0.0.1"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          git tag "v$version"
          git push origin "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: version

    strategy:
      matrix:
        include:
          - name: caddy-geoblock-crowdsec
            description: "Caddy Docker hardened build with Cloudflare DNS, CrowdSec Bouncer, GeoBlock, and rate limit modules"
          - name: caddy-geoblock-ip-crowdsec
            description: "Caddy Docker hardened build with Cloudflare DNS, CrowdSec Bouncer, GeoBlock, dynamic IP whitelist, and rate limit modules"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Generate image metadata
        uses: docker/metadata-action@v6
        id: metadata
        with:
          images: |
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,prefix=
          labels: |
            org.opencontainers.image.title=${{ matrix.name }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hardened Images registry
        uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.name }}/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
